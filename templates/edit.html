<!doctype html>
<html lang="en">
<head>
  <title>Edit Transaction</title>
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" >

</head>
<body>
  <h1>Edit Transaction</h1>
  <form method="POST">
    <label>Type:</label>
    <select name="type">
      <option value="income" {% if t.type == "income" %}selected{% endif %}>Income</option>
      <option value="expense" {% if t.type == "expense" %}selected{% endif %}>Expense</option>
    </select>
    <br><br>

    <label>Category:</label>
    <input type="text" name="category" value="{{ t.category }}">
    <br><br>

    <label>Amount:</label>
    <input type="text" name="amount" value="{{ t.amount }}">
    <br><br>

    <label>Date:</label>
    <input type="date" name="date" value="{{ t.date }}">
    <br><br>

    <label>Description:</label>
    <input type="text" name="description" value="{{ t.description }}">
    <br><br>

    <button type="submit" class="btn">Save Changes</button>
  </form>
</body>
</html>
