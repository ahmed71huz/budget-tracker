<!doctype html>
<html lang="en">

<head>
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
  <title>Budget Tracker</title>
</head>

<body>
  <h1>Transactions</h1>
  <a href="/add" class="btn">+ Add New Transaction</a>
  <a href="/dashboard" class="btn">View Dashboard</a>
  <a href="/export" class="btn">Export to Excel</a>


  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Category</th>
        <th>Type</th>
        <th>Description</th>
        <th>Amount</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      {% for t in transactions %}
      <tr>
        <td>{{ t.date }}</td>
        <td>{{ t.category}}</td>
        <td><span class=" badge {{ t.type }}">{{t.type }}</span></td>
        <td>{{t.description}}</td>
        <td class=" amount {{ t.type }}"> {{t.amount }}</td>
        <td>
          <a href="/edit/{{ t.id }}" class="btn btn-sm">Edit</a>
          <form method="POST" action="/delete/{{ t.id }}" style="display:inline;">
            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>

</html>
