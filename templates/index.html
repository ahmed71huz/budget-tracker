<!doctype html>
<html lang="en">
<head>
  <title>Budget Tracker</title>
</head>
<body>
  <h1>Transactions</h1>
  <a href="/add">+ Add New Transaction</a>
  <a href="/dashboard">View Dashboard</a>
  <a href="/export">Export to Excel</a>
  

  <ul>
    {% for t in transactions %}
      <li>
        {{ t.date }} - {{ t.type }} - {{ t.category }} - {{ t.amount }} SAR
        <a href="/edit/{{ t.id }}">Edit</a>
        <form method="POST" action="/delete/{{ t.id }}" style="display:inline;">
          <button type="submit">Delete</button>
        </form>
      </li>
    {% endfor %}
  </ul>
</body>
</html>
